[project]
name = "vgi-dlt-fixture"
version = "0.1.0"
description = "A tiny offline @dlt.source used by the vgi-dlt tests (path := and pip_url := loading)."
requires-python = ">=3.10"
dependencies = ["dlt", "pyarrow"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vgi_dlt_fixture"]
